<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g-aero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#090f20"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g-aero)"/>

  <!-- Piste d'atterrissage avec balisage lumineux dynamique -->
  <polygon points="340,160 460,160 620,450 180,450" fill="#162032" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="400" y1="160" x2="400" y2="450" stroke="#facc15" stroke-width="4" stroke-dasharray="24,18"/>

  <!-- Feux de balisage lumineux vert/bleu/rouge -->
  <g fill="#38bdf8">
    <circle cx="210" cy="430" r="5"/><circle cx="210" cy="430" r="14" fill="none" stroke="#38bdf8" opacity="0.6"/>
    <circle cx="590" cy="430" r="5"/><circle cx="590" cy="430" r="14" fill="none" stroke="#38bdf8" opacity="0.6"/>
    <circle cx="270" cy="330" r="4"/><circle cx="530" cy="330" r="4"/>
    <circle cx="310" cy="240" r="3"/><circle cx="490" cy="240" r="3"/>
  </g>

  <!-- Silhouette avion en approche avec données radar -->
  <g transform="translate(400, 110) scale(0.7)">
    <path d="M0,-40 L6,-10 L38,8 L38,16 L6,10 L4,34 L14,42 L14,48 L0,44 L-14,48 L-14,42 L-4,34 L-6,10 L-38,16 L-38,8 L-6,-10 Z" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Cercle radar aéroportuaire -->
  <circle cx="400" cy="110" r="55" stroke="#E31B23" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.6"/>

  <rect x="36" y="32" width="220" height="34" rx="8" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="50" y="54" fill="#7dd3fc" font-family="'Inter', sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">AÉROPORTS &amp; PISTES</text>
  <text x="36" y="415" fill="rgba(255,255,255,0.7)" font-family="'Inter', sans-serif" font-weight="600" font-size="15">SÛRETÉ OACI &amp; BALISAGE INTELLIGENT</text>
</svg>
