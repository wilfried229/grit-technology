<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g-hopitaux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09203f"/>
      <stop offset="50%" stop-color="#143b59"/>
      <stop offset="100%" stop-color="#0b1727"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g-hopitaux)"/>

  <!-- Tracé ECG / Pulsation énergie critique -->
  <path d="M0,230 L220,230 L240,210 L260,260 L285,170 L310,290 L330,215 L350,245 L370,230 L800,230" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.75"/>
  <path d="M0,230 L800,230" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Grille hôpital connecté -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <circle cx="400" cy="230" r="140" fill="none"/>
    <circle cx="400" cy="230" r="80" fill="none"/>
  </g>

  <!-- Croix médicale & Énergie sécurisée -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="48" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
    <path d="M-8,-22 H8 V-8 H22 V8 H8 V22 H-8 V8 H-22 V-8 H-8 Z" fill="#10b981"/>
  </g>

  <!-- Points d'alimentation sans coupure -->
  <g fill="#10b981">
    <circle cx="285" cy="170" r="5"/>
    <circle cx="310" cy="290" r="5"/>
    <circle cx="580" cy="160" r="4"/><circle cx="580" cy="160" r="12" fill="none" stroke="#10b981" opacity="0.4"/>
  </g>

  <rect x="36" y="32" width="220" height="34" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="50" y="54" fill="#6ee7b7" font-family="'Inter', sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">SANTÉ &amp; HÔPITAUX</text>
  <text x="36" y="415" fill="rgba(255,255,255,0.7)" font-family="'Inter', sans-serif" font-weight="600" font-size="15">ÉNERGIE CRITIQUE &amp; SÉCURITÉ INCENDIE</text>
</svg>
